# ===================================================================
# Configuration de la base de données H2 (en mémoire)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:parcdb
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.path=/h2
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# Configuration JPA / Hibernate
# ===================================================================
# Stratégie de génération des tables (update / create / create-drop)
spring.jpa.hibernate.ddl-auto=update

# Affichage des requêtes SQL générées dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Diffère l'exécution de data.sql après la création du schéma par Hibernate
spring.jpa.defer-datasource-initialization=true

# Désactive la mise en cache des templates Thymeleaf pour le développement
spring.thymeleaf.cache=false
