<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une Imprimante</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white p-3">
                        <h4 class="card-title mb-0">
                            <i class="bi bi-printer me-2"></i>Ajouter une Imprimante
                        </h4>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="@{/addImprimante}" method="POST" class="needs-validation"
                            novalidate>

                            <!-- Propriétés d'Equipement -->
                            <h5 class="text-success mb-3"><i class="bi bi-info-circle me-2"></i>Informations générales
                            </h5>

                            <div class="mb-3">
                                <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nom" name="nom"
                                    placeholder="ex: IMP-COMPTA-COLOR" required>
                                <div class="invalid-feedback">Le nom est obligatoire.</div>
                            </div>

                            <div class="mb-3">
                                <label for="numeroSerie" class="form-label">Numéro de série <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="numeroSerie" name="numeroSerie"
                                    placeholder="ex: SN-IMP-2026-05" required>
                                <div class="invalid-feedback">Le numéro de série est obligatoire.</div>
                            </div>

                            <div class="mb-3">
                                <label for="prix" class="form-label">Prix (€)</label>
                                <div class="input-group">
                                    <input type="number" step="0.01" class="form-control" id="prix" name="prix"
                                        placeholder="0.00">
                                    <span class="input-group-text">€</span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="service" class="form-label">Service assigné <span
                                        class="text-danger">*</span></label>
                                <select class="form-select" id="service" name="serviceId" required>
                                    <option value="" selected disabled>-- Sélectionner un service --</option>
                                    <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.nom}"></option>
                                </select>
                                <div class="invalid-feedback">Veuillez sélectionner un service.</div>
                            </div>

                            <hr class="my-4">

                            <!-- Propriétés spécifiques d'Imprimante -->
                            <h5 class="text-success mb-3"><i class="bi bi-sliders me-2"></i>Options d'impression</h5>

                            <div class="mb-4 form-check form-switch fs-5">
                                <input class="form-check-input" type="checkbox" id="estCouleur" name="estCouleur"
                                    value="true">
                                <label class="form-check-label fs-6 align-middle ms-1" for="estCouleur">
                                    Impression couleur
                                </label>
                            </div>

                            <!-- Actions -->
                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a href="/" class="btn btn-outline-secondary">Annuler</a>
                                <button type="submit" class="btn btn-success px-4">
                                    <i class="bi bi-check-circle me-1"></i>Enregistrer
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>

</html>
