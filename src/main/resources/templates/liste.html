<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parc Informatique</title>
    <!-- Bootstrap 5 CDN -->
    <!-- <link rel="stylesheet" th:href="@{/css/style.css}"> --> 
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
   <!-- Bootstrap Icons pour les icônes des boutons -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container bg-white p-4 rounded shadow-sm">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary mb-0">🖥️ Parc Informatique</h2>
            
            <div class="d-flex align-items-center gap-2">
                <!-- Boutons d'ajout (visibles uniquement pour les ADMIN) -->
                <div class="d-flex gap-2" th:if="${isAdmin}">
                    <a href="/addOrdinateur" class="btn btn-primary">
                        <i class="bi bi-laptop me-1"></i> Ajouter un ordinateur
                    </a>
                    <a href="/addImprimante" class="btn btn-success">
                        <i class="bi bi-printer me-1"></i> Ajouter une imprimante
                    </a>
                </div>

                <!-- Bouton de déconnexion (visible pour tout utilisateur authentifié) -->
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-1"></i> Déconnexion
                    </button>
                </form>
            </div>
        </div>

        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>N° Série</th>
                    <th>Prix</th>
                    <th>Service</th>
                    <th>Caractéristiques</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="equipement : ${equipements}">
                    <td th:text="${equipement.id}"/>
                    <td class="fw-bold" th:text="${equipement.nom}"/>
                    <td th:text="${equipement.numeroSerie}"/>
                    <td th:text="${equipement.prix != null ? equipement.prix + ' €' : '-'}"/>
                    <td>
                        <span class="badge bg-secondary" 
                              th:text="${equipement.service != null ? equipement.service.nom : 'Non affecté'}"/>
                    </td>
                    <td>
                        <span class="badge bg-info text-dark" th:if="${equipement instanceof T(fr.medassi.democours.models.Ordinateur)}">
                            💻 PC [<span th:text="${equipement.typePc}"/>] 
                            <span th:text="${equipement.ramGo}"/>Go RAM / 
                            <span th:text="${equipement.processeur}"/>
                        </span>
                        <span class="badge bg-warning text-dark" th:if="${equipement instanceof T(fr.medassi.democours.models.Imprimante)}">
                            🖨️ Imprimante — Couleur : <span th:text="${equipement.estCouleur ? 'Oui' : 'Non'}"/>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
